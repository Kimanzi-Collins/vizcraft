<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uber Architecture - Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    :root {
      /* Base transitions */
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
      --font-sans: 'Space Grotesk', sans-serif;
      --font-mono: 'Space Mono', monospace;
      
      /* Default Theme: dark_neon */
      --bg-color: #080808;
      --surface-color: rgba(16, 16, 16, 0.85);
      --border-color: #1c1c1c;
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --accent: #e0e0e0;
      
      /* Kind Colors */
      --kind-entry: #3b82f6;
      --kind-agent: #f59e0b;
      --kind-service: #8b5cf6;
      --kind-store: #10b981;
      --kind-external: #06b6d4;
      --kind-model: #ec4899;
      --kind-cron: #f97316;
      --kind-tool: #84cc16;
      --kind-default: #666666;
    }

    [data-theme="rdr2_gritty"] {
      --font-sans: Georgia, serif;
      --font-mono: 'Courier New', Courier, monospace;
      --bg-color: #0f0c08;
      --surface-color: rgba(26, 20, 16, 0.9);
      --border-color: #2e261e;
      --text-main: #d4c5a9;
      --text-muted: #8c7f6b;
      --accent: #cc2222;
    }

    [data-theme="minimal_light"] {
      --bg-color: #f8f8f6;
      --surface-color: rgba(255, 255, 255, 0.9);
      --border-color: #e8e8e8;
      --text-main: #111111;
      --text-muted: #666666;
      --accent: #111111;
    }

    [data-theme="cyberpunk"] {
      --bg-color: #fce300;
      --surface-color: rgba(252, 227, 0, 0.9);
      --border-color: #000000;
      --text-main: #000000;
      --text-muted: #333333;
      --accent: #ff003c;
      --complete-color: #00f0ff;
    }
    
    [data-theme="dracula"] {
      --bg-color: #282a36;
      --surface-color: rgba(40, 42, 54, 0.9);
      --border-color: #44475a;
      --text-main: #f8f8f2;
      --text-muted: #6272a4;
      --accent: #ff79c6;
      --complete-color: #50fa7b;
    }

    [data-theme="synthwave"] {
      --bg-color: #2b213a;
      --surface-color: rgba(43, 33, 58, 0.9);
      --border-color: #241b2f;
      --text-main: #f9f9f9;
      --text-muted: #b891d4;
      --accent: #f85b84;
      --complete-color: #3fe0d0;
    }

    [data-theme="nord"] {
      --bg-color: #2e3440;
      --surface-color: rgba(46, 52, 64, 0.9);
      --border-color: #4c566a;
      --text-main: #eceff4;
      --text-muted: #d8dee9;
      --accent: #88c0d0;
      --complete-color: #a3be8c;
    }
    
    [data-theme="gruvbox"] {
      --bg-color: #282828;
      --surface-color: rgba(40, 40, 40, 0.9);
      --border-color: #3c3836;
      --text-main: #ebdbb2;
      --text-muted: #a89984;
      --accent: #fe8019;
      --complete-color: #b8bb26;
    }
    
    [data-theme="solarized_dark"] {
      --bg-color: #002b36;
      --surface-color: rgba(0, 43, 54, 0.9);
      --border-color: #073642;
      --text-main: #839496;
      --text-muted: #586e75;
      --accent: #b58900;
      --complete-color: #2aa198;
    }
    
    [data-theme="monokai"] {
      --bg-color: #272822;
      --surface-color: rgba(39, 40, 34, 0.9);
      --border-color: #3e3d32;
      --text-main: #f8f8f2;
      --text-muted: #75715e;
      --accent: #fd971f;
      --complete-color: #a6e22e;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: var(--accent);
      color: var(--bg-color);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      transition: background-color 0.5s var(--ease-smooth), color 0.5s var(--ease-smooth);
    }

    /* Subtle dot-grid pattern */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    /* SVG Canvas */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* SVG Elements Styling */
    .group-box {
      fill: var(--bg-color);
      stroke: var(--border-color);
      stroke-width: 1;
      rx: 8;
      transition: stroke 0.3s var(--ease-smooth), fill 0.3s var(--ease-smooth);
    }
    [data-theme="dark_neon"] .group-box { fill: #0c0c0c; }
    
    .group-label {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      fill: var(--text-muted);
      letter-spacing: 1px;
    }

    .node-rect {
      fill: var(--bg-color);
      stroke: var(--border-color);
      stroke-width: 1;
      rx: 5;
      transition: fill 0.3s var(--ease-smooth), stroke 0.3s var(--ease-smooth), opacity 0.3s var(--ease-smooth);
    }
    [data-theme="dark_neon"] .node-rect { fill: #111111; stroke: #222222; }

    .node-label {
      font-family: var(--font-sans);
      font-size: 11px;
      fill: var(--text-main);
      pointer-events: none;
      transition: fill 0.3s var(--ease-smooth);
    }

    .edge-path {
      fill: none;
      stroke: var(--border-color);
      stroke-width: 1.5;
      transition: stroke 0.3s var(--ease-smooth), stroke-dashoffset 1s var(--ease-smooth), opacity 0.3s var(--ease-smooth);
    }
    [data-theme="dark_neon"] .edge-path { stroke: #2a2a2a; }

    .edge-label-bg {
      fill: var(--bg-color);
      rx: 2;
    }
    .edge-label-text {
      font-family: var(--font-mono);
      font-size: 9px;
      fill: var(--text-muted);
      text-anchor: middle;
      dominant-baseline: middle;
    }

    /* Sidebar UI */
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100vh;
      background: var(--surface-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid var(--border-color);
      z-index: 10;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.6s var(--ease-smooth), background 0.5s var(--ease-smooth), border-color 0.5s var(--ease-smooth);
    }
    #sidebar.open {
      transform: translateX(0);
    }

    #sidebar-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      backdrop-filter: blur(8px);
      transition: all 0.3s var(--ease-smooth);
    }
    #sidebar-toggle:hover {
      background: var(--border-color);
    }
    #sidebar-toggle svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #sidebar.open ~ #sidebar-toggle {
      left: 290px;
    }

    .sidebar-header {
      padding: 80px 24px 24px 24px;
      border-bottom: 1px solid var(--border-color);
    }
    .project-name {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .project-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .tabs {
      display: flex;
      padding: 0 24px;
      margin-top: -16px;
    }
    .tab-btn {
      flex: 1;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 0;
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s var(--ease-smooth);
    }
    .tab-btn:first-child {
      border-radius: 16px 0 0 16px;
      border-right: none;
    }
    .tab-btn:last-child {
      border-radius: 0 16px 16px 0;
    }
    .tab-btn.active {
      background: var(--border-color);
      color: var(--text-main);
    }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Legend Items */
    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.3s;
    }
    .legend-item:hover {
      opacity: 1;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Story Steps */
    .story-step {
      position: relative;
      padding-left: 16px;
      margin-bottom: 20px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.3s var(--ease-smooth);
    }
    .story-step::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border-color);
      transition: background 0.3s;
    }
    .story-step:hover, .story-step.active {
      opacity: 1;
    }
    .story-step.active::before {
      background: var(--accent);
    }
    .step-title {
      font-weight: 500;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .step-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .sidebar-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
    }
    .theme-select {
      width: 100%;
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }
    .btn-reset {
      width: 100%;
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 11px;
      margin-top: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-reset:hover {
      background: var(--border-color);
    }

    /* Zoom Controls */
    #zoom-controls {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .zoom-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s;
    }
    .zoom-btn:hover {
      background: var(--border-color);
    }

    /* Particles */
    .particle {
      pointer-events: none;
      filter: drop-shadow(0 0 4px currentColor);
    }

    /* Dimming state */
    .dimmed {
      opacity: 0.15 !important;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>

    function getPortCoords(node, portHint, otherNode, type) {
      let port = portHint;
      if (!port || port === 'auto') {
        const dx = otherNode.x - node.x;
        const dy = otherNode.y - node.y;
        if (Math.abs(dx) > Math.abs(dy)) {

        } else {
          port = dy > 0 ? (type === 'source' ? 'bottom' : 'top') : (type === 'source' ? 'top' : 'bottom');
        }
      }

      switch (port) {
        case 'top': return { x: node.x + node.width/2, y: node.y, dir: 'v' };
        case 'bottom': return { x: node.x + node.width/2, y: node.y + node.height, dir: 'v' };
        case 'left': return { x: node.x, y: node.y + node.height/2, dir: 'h' };
        case 'right': return { x: node.x + node.width, y: node.y + node.height/2, dir: 'h' };

      const c1 = { x: p1.x, y: p1.y };
      const c2 = { x: p2.x, y: p2.y };
      
      if (p1.dir === 'h') c1.x += (p2.x > p1.x ? tension : -tension);
      else c1.y += (p2.y > p1.y ? tension : -tension);
      
      if (p2.dir === 'h') c2.x += (p1.x > p2.x ? tension : -tension);
      else c2.y += (p1.y > p2.y ? tension : -tension);

      return `M ${p1.x} ${p1.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${p2.x} ${p2.y}`;

        let delta = -Math.sign(e.deltaY) * 0.1;

        if (!isDragging) return;
        transform.x = e.clientX - startDrag.x;
        transform.y = e.clientY - startDrag.y;
        updateTransform();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      const cy = window.innerHeight / 2;

      const ys = (cy - transform.y) / transform.scale;
      
      transform.scale = Math.min(Math.max(0.2, transform.scale + delta), 4);
      transform.x = cx - xs * transform.scale;
      transform.y = cy - ys * transform.scale;

        ease: "power2.out"
      });
    }

    function centerCanvas() {
      const bbox = canvasGroup.getBBox();
      if (bbox.width === 0) return;
      
      const padding = 100;
      const scaleX = (window.innerWidth - padding * 2) / bbox.width;
      const scaleY = (window.innerHeight - padding * 2) / bbox.height;
      let scale = Math.min(scaleX, scaleY, 1);
      
      // If scale is negative or invalid, default to 1
      if(scale <= 0) scale = 1;
      
      const tx = (window.innerWidth - bbox.width * scale) / 2 - bbox.x * scale;
      const ty = (window.innerHeight - bbox.height * scale) / 2 - bbox.y * scale;
      
      transform = { x: tx, y: ty, scale };
      
      gsap.to(transform, {
        x: tx, y: ty, scale: scale,
        duration: 0.6,
        ease: "power3.out",
        onUpdate: updateTransform
      });
    }

    function runEntryAnimation() {
      const tl = gsap.timeline();
      
      // Groups fade in
      tl.from('.group-container', {
        opacity: 0,
        y: 20,
        duration: 0.5,
        stagger: 0.1,
        ease: "power2.out"
      });
      
      // Nodes scale in
      tl.from('.node-container', {
        scale: 0,
        transformOrigin: "center center",
        duration: 0.6,
        stagger: 0.02,
        ease: "back.out(1.5)"
      }, "-=0.2");
      
      // Edges draw in
      const paths = document.querySelectorAll('.edge-path');
      paths.forEach(p => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });
      
      tl.to('.edge-path', {
        strokeDashoffset: 0,
        duration: 1,
        stagger: 0.05,
        ease: "power2.inOut"
      }, "-=0.4");
      
      // Labels fade
      tl.from('.edge-label-bg, .edge-label-text', {
        opacity: 0,
        duration: 0.5
      }, "-=0.5");
    }

    // Start
    window.addEventListener('DOMContentLoaded', init);

  </script>
</body>
</html>
