  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    :root {
      --font-sans: 'Space Grotesk', sans-serif;

    /*
  VizCraft shared themes
  ----------------------
  Injected into every template at generate time (see generate.py).

  To add a theme:
    1. Add a block below with a `@theme <id> | <Label>` marker comment.
    2. Define at least the core tokens (bg / surface / border / text / accent).
    3. Done. generate.py discovers the marker and the theme picker, the
       validator and SKILL.md-listed names all pick it up from here.

  Tokens
    --bg-color --surface-color --border-color --text-main --text-muted
    --accent --complete-color            core palette
    --group-fill --node-fill --node-stroke   architecture surfaces
    --dot-color                          background grid dots
    --kind-<kind>                        node colours (architecture)
    --phase-1..6                         phase colours (progress)
*/

:root {
  --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
  --font-mono: 'Space Mono', monospace;

  /* Default kind palette (dark backgrounds) */
  --kind-entry: #3b82f6;
  --kind-agent: #f59e0b;
  --kind-service: #8b5cf6;
  --kind-store: #10b981;
  --kind-external: #06b6d4;
  --kind-model: #ec4899;
  --kind-cron: #f97316;
  --kind-tool: #84cc16;
  --kind-queue: #d946ef;
  --kind-gateway: #14b8a6;
  --kind-client: #60a5fa;
  --kind-cache: #facc15;
  --kind-function: #fb7185;
  --kind-user: #cbd5e1;
  --kind-monitor: #818cf8;
  --kind-security: #ef4444;
  --kind-default: #7a7f87;
}

/* Derived tokens: resolved on <body> so they follow the active theme. */
body {
  --track-bg: rgba(128, 128, 128, 0.18);
  --hover-bg: rgba(128, 128, 128, 0.12);
  --phase-1: var(--kind-entry);
  --phase-2: var(--kind-service);
  --phase-3: var(--kind-store);
  --phase-4: var(--kind-agent);
  --phase-5: var(--kind-model);
  --phase-6: var(--kind-external);
}

    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::selection { background: var(--accent); color: var(--bg-color); }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      transition: background-color 0.5s var(--ease-smooth), color 0.5s var(--ease-smooth);
    }

    /* Dot-grid backdrop */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    /* ---- Canvas ---- */
    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      cursor: grab;
      touch-action: none;
    }
    #canvas-container.panning { cursor: grabbing; }
    svg { width: 100%; height: 100%; display: block; }

    .group-box {
      fill: var(--group-fill);
      stroke: var(--border-color);
      stroke-width: 1;
      rx: 10;
      transition: stroke 0.3s var(--ease-smooth), fill 0.3s var(--ease-smooth);
    }
    .group-label {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      fill: var(--text-muted);
      letter-spacing: 1px;
      pointer-events: none;
    }

    .node-container {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 0.3s var(--ease-smooth), filter 0.3s var(--ease-smooth);
    }
    .node-rect {
      fill: var(--node-fill);
      stroke: var(--node-stroke);
      stroke-width: 1.25;
      rx: 6;
      transition: fill 0.3s var(--ease-smooth), stroke 0.3s var(--ease-smooth);
    }
    .node-tint { fill: var(--kc); opacity: 0; pointer-events: none; rx: 6; transition: opacity 0.3s; }
    .node-cap { fill: none; stroke: var(--node-stroke); stroke-width: 1.25; pointer-events: none; }
    .logo-mono { filter: var(--logo-filter, none); }
    .node-label {
      font-family: var(--font-sans);
      font-size: 11px;
      fill: var(--text-main);
      pointer-events: none;
    }
    body.entering .node-container, body.entering .edge-container { transition: none !important; }
    .node-container:hover .node-rect { stroke: var(--kc); }
    .node-container.selected .node-rect { stroke: var(--accent); stroke-width: 2; }

    /* Node styles (project.nodeStyle / sidebar picker) */
    body[data-node-style="tinted"] .node-tint { opacity: 0.16; }
    body[data-node-style="tinted"] .node-rect { stroke: var(--kc); stroke-opacity: 0.55; }
    body[data-node-style="outline"] .node-rect { stroke: var(--kc); stroke-width: 1.75; }
    body[data-node-style="outline"] .node-cap { stroke: var(--kc); stroke-width: 1.75; }
    body[data-node-style="outline"] .node-container { filter: drop-shadow(0 0 5px var(--kc)); }

    .edge-path {
      fill: none;
      stroke: var(--edge-color, var(--text-muted));
      stroke-opacity: 0.55;
      stroke-width: 1.5;
      stroke-linejoin: round;
      transition: stroke 0.3s var(--ease-smooth), stroke-opacity 0.3s var(--ease-smooth), stroke-width 0.3s var(--ease-smooth);
    }

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      const grow = r => { minX = Math.min(minX, r.x); minY = Math.min(minY, r.y); maxX = Math.max(maxX, r.x + r.w); maxY = Math.max(maxY, r.y + r.h); };
      nodes.forEach(grow); model.groups.forEach(grow);
      const PAD = 90;
      const ox = Math.floor((minX - PAD) / G) * G, oy = Math.floor((minY - PAD) / G) * G;
      const W = Math.ceil((maxX + PAD - ox) / G) + 1, H = Math.ceil((maxY + PAD - oy) / G) + 1;
      const size = W * H;
      const grid = {
        ox, oy, W, H, size,
        blocked: new Uint8Array(size), tight: new Uint8Array(size), usedH: new Uint8Array(size), usedV: new Uint8Array(size),
        penH: new Uint8Array(size), penV: new Uint8Array(size)
      };
      const cellRange = (x0, x1, y0, y1, fn) => {
        const i0 = Math.max(0, Math.ceil((x0 - ox - G / 2) / G)), i1 = Math.min(W - 1, Math.floor((x1 - ox - G / 2) / G));
        const j0 = Math.max(0, Math.ceil((y0 - oy - G / 2) / G)), j1 = Math.min(H - 1, Math.floor((y1 - oy - G / 2) / G));
        for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) fn(j * W + i);
      };
      nodes.forEach(n => {
        cellRange(n.x - MARGIN + 0.01, n.x + n.w + MARGIN - 0.01, n.y - MARGIN + 0.01, n.y + n.h + MARGIN - 0.01, c => { grid.blocked[c] = 1; });
        cellRange(n.x - TIGHT_MARGIN + 0.01, n.x + n.w + TIGHT_MARGIN - 0.01, n.y - TIGHT_MARGIN + 0.01, n.y + n.h + TIGHT_MARGIN - 0.01, c => { grid.tight[c] = 1; });
        // Soft halo so lines keep a little distance from node walls
        cellRange(n.x - MARGIN - G, n.x + n.w + MARGIN + G, n.y - MARGIN - G, n.y + n.h + MARGIN + G, c => {
          if (!grid.blocked[c]) { grid.penH[c] = Math.min(255, grid.penH[c] + 1); grid.penV[c] = Math.min(255, grid.penV[c] + 1); }
        });
      });
      model.groups.forEach(g => {
        // Running along a group's border reads as a clash, so discourage it.
        cellRange(g.x - G / 2, g.x + g.w + G / 2, g.y - G / 2, g.y + G / 2, c => { grid.penH[c] = Math.min(255, grid.penH[c] + 4); });
        cellRange(g.x - G / 2, g.x + g.w + G / 2, g.y + g.h - G / 2, g.y + g.h + G / 2, c => { grid.penH[c] = Math.min(255, grid.penH[c] + 4); });
        cellRange(g.x - G / 2, g.x + G / 2, g.y, g.y + g.h, c => { grid.penV[c] = Math.min(255, grid.penV[c] + 4); });
        cellRange(g.x + g.w - G / 2, g.x + g.w + G / 2, g.y, g.y + g.h, c => { grid.penV[c] = Math.min(255, grid.penV[c] + 4); });
        const labelW = g.label.length * 7 + 28;
        cellRange(g.x, g.x + labelW, g.y, g.y + 24, c => { grid.penH[c] = Math.min(255, grid.penH[c] + 6); grid.penV[c] = Math.min(255, grid.penV[c] + 6); });
      });
      return grid;
    }

    const cellIndex = (grid, p) => {
      const i = Math.round((p.x - grid.ox - G / 2) / G), j = Math.round((p.y - grid.oy - G / 2) / G);
      return (i < 0 || j < 0 || i >= grid.W || j >= grid.H) ? -1 : j * grid.W + i;
    };
    const cellCenter = (grid, c) => ({ x: grid.ox + (c % grid.W) * G + G / 2, y: grid.oy + Math.floor(c / grid.W) * G + G / 2 });

    /* Binary min-heap keyed by f-score */
    function Heap() { this.k = []; this.v = []; }
    Heap.prototype.push = function (key, val) {
      const k = this.k, v = this.v; let i = k.length; k.push(key); v.push(val);
      while (i > 0) { const p = (i - 1) >> 1; if (k[p] <= key) break; k[i] = k[p]; v[i] = v[p]; i = p; }
      k[i] = key; v[i] = val;
    };
    Heap.prototype.pop = function () {
      const k = this.k, v = this.v, top = v[0], lk = k.pop(), lv = v.pop();
      if (k.length) {
        let i = 0; const n = k.length;
        for (;;) {
          let c = 2 * i + 1; if (c >= n) break;
          if (c + 1 < n && k[c + 1] < k[c]) c++;
          if (k[c] >= lk) break;
          k[i] = k[c]; v[i] = v[c]; i = c;
        }
        k[i] = lk; v[i] = lv;
      }
      return top;
    };

    /* goalDir is the direction of the final step into goalCell. With `relaxed`, any
       arrival is accepted except one that doubles back out of the target node. */
    function findPath(grid, blocked, startCell, startDir, goalCell, goalDir, relaxed, mask) {
      const { W, H, size } = grid;
      if (startCell < 0 || goalCell < 0) return null;
      if (startCell === goalCell) return [startCell];
      const gx = goalCell % W, gy = (goalCell / W) | 0;
      const g = new Float32Array(size * 4).fill(Infinity);
      const from = new Int32Array(size * 4).fill(-1);
      const heap = new Heap();
      const s0 = startCell * 4 + startDir;
      g[s0] = 0; heap.push(0, s0);
      let guard = 0;
      while (heap.k.length && guard++ < 600000) {
        const st = heap.pop();
        const c = st >> 2, d = st & 3;
        if (c === goalCell && (relaxed ? d !== ((goalDir + 2) & 3) : d === goalDir)) {
          const path = [];
          for (let s = st; s !== -1; s = from[s]) path.push(s >> 2);
          return path.reverse();
        }
        const cx = c % W, cy = (c / W) | 0, gc = g[st];
        for (let t = 0; t < 3; t++) {
          const nd = t === 0 ? d : t === 1 ? (d + 1) & 3 : (d + 3) & 3;
          const nx = cx + DX[nd], ny = cy + DY[nd];
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const nc = ny * W + nx;
          if (blocked[nc]) continue;
          let cost = 1 + (nd !== d ? BEND_COST : 0);
          if (nd === 0 || nd === 2) {
            cost += grid.penH[nc];
            if (grid.usedH[nc]) cost += OVERLAP_COST;
            if (grid.usedV[nc]) cost += CROSS_COST;
            if (ny > 0 && grid.usedH[nc - W]) cost += NEAR_COST;
            if (ny < H - 1 && grid.usedH[nc + W]) cost += NEAR_COST;
          } else {
            cost += grid.penV[nc];
            if (grid.usedV[nc]) cost += OVERLAP_COST;
            if (grid.usedH[nc]) cost += CROSS_COST;
            if (nx > 0 && grid.usedV[nc - 1]) cost += NEAR_COST;
            if (nx < W - 1 && grid.usedV[nc + 1]) cost += NEAR_COST;
          }
          if (mask && mask[nc]) cost += OUTSIDE_COST;
          const ns = nc * 4 + nd, ng = gc + cost;
          if (ng < g[ns]) {
            g[ns] = ng; from[ns] = st;
            heap.push(ng + Math.abs(nx - gx) + Math.abs(ny - gy), ns);
          }
        }
      }
      return null;
    }

    /* 1 for every cell outside the group's box (cached per group per grid). */
    function groupMask(grid, g) {
      grid.masks = grid.masks || new Map();
      if (!grid.masks.has(g.id)) {
        const m = new Uint8Array(grid.size);
        for (let c = 0; c < grid.size; c++) {
          const p = cellCenter(grid, c);
          if (p.x < g.x + 4 || p.x > g.x + g.w - 4 || p.y < g.y + 4 || p.y > g.y + g.h - 4) m[c] = 1;
        }
        grid.masks.set(g.id, m);
      }
      return grid.masks.get(g.id);
    }

    function markUsed(grid, cells) {
      for (let i = 0; i < cells.length; i++) {
        const c = cells[i];
        const prev = i > 0 ? cells[i - 1] : null, next = i < cells.length - 1 ? cells[i + 1] : null;
        [prev, next].forEach(o => {
          if (o === null) return;
          if (Math.abs(o - c) === 1) grid.usedH[c] = Math.min(255, grid.usedH[c] + 1);
          else grid.usedV[c] = Math.min(255, grid.usedV[c] + 1);
        });
      }
    }

    function cellsToCorners(grid, cells) {
      return simplify(cells.map(c => cellCenter(grid, c)));
    }

    /* Ports that sit off the lattice (diamond/hexagon centres) differ from the
       first/last cell centre by a few px. Replace the ends with the exact stub
       points and slide the adjoining run onto the same row/column so the line
       stays orthogonal without a visible jog. */
    function snapEnds(pts, S, T) {
      const A = pts[0], Z = pts[pts.length - 1];
      if (pts.length >= 3) {
        const a = pts[1], z = pts[pts.length - 2];
        if (Math.abs(A.y - a.y) < 0.01) a.y = S.y; else a.x = S.x;
        if (Math.abs(Z.y - z.y) < 0.01) z.y = T.y; else z.x = T.x;
      }
      pts[0] = S; pts[pts.length - 1] = T;
      return pts;
    }

    function routeEdges(edgeStyle) {
      const edges = model.edges.filter(e => e.src && e.tgt);
      model.edges.forEach(e => { e.pts = null; });
      if (!edges.length) return;

      // A side is unusable when its stub point lands inside a neighbouring node's clearance.
      const nodeList = Array.from(model.nodes.values());
      const sideOpen = (n, side) => {
        const slots = sideSlots(n, side);
        const S = stubPoint(portPoint(n, side, slots[Math.floor((slots.length - 1) / 2)].v), side);
        return !nodeList.some(o => o !== n && S.x > o.x - MARGIN && S.x < o.x + o.w + MARGIN && S.y > o.y - MARGIN && S.y < o.y + o.h + MARGIN);
      };
      const chooseSide = (n, other, hint) => {
        const first = pickSide(n, other, hint);
        if (sideOpen(n, first)) return first;
        const ox = other.x + other.w / 2, oy = other.y + other.h / 2;
        const score = side => {
          const slots = sideSlots(n, side), p = portPoint(n, side, slots[Math.floor((slots.length - 1) / 2)].v);
          return Math.abs(p.x - ox) + Math.abs(p.y - oy);
        };
        const alts = SIDES.filter(sd => sd !== first && sideOpen(n, sd)).sort((a, b) => score(a) - score(b));
        return alts.length ? alts[0] : first;
      };

      const normal = [];
      edges.forEach(e => {
        if (e.src === e.tgt) { e.pts = loopRoute(e.src); e.loop = true; return; }
        e.loop = false;
        e.sSide = chooseSide(e.src, e.tgt, e.sourcePort);
        e.tSide = chooseSide(e.tgt, e.src, e.targetPort);
        normal.push(e);
      });
      // Diamonds (and hexagon left/right) expose one port per side. When several edges
      // would share that port, fan the later ones out onto unused sides, flowchart style.
      const uses = new Map();
      const bump = (n, side, by) => { const k = n.id + '|' + side; uses.set(k, (uses.get(k) || 0) + by); };
      normal.forEach(e => { bump(e.src, e.sSide, 1); bump(e.tgt, e.tSide, 1); });
      const claimed = new Set();   // the first edge to reach a single-port side keeps it
      const fanOut = (e, end) => {
        const n = end === 's' ? e.src : e.tgt, other = end === 's' ? e.tgt : e.src;
        const cur = end === 's' ? e.sSide : e.tSide;
        if (sideSlots(n, cur).length !== 1) return;
        const key = n.id + '|' + cur;
        if (!claimed.has(key)) { claimed.add(key); return; }
        const ox = other.x + other.w / 2, oy = other.y + other.h / 2;
        const score = side => { const p = portPoint(n, side, sideSlots(n, side)[0].v); return Math.abs(p.x - ox) + Math.abs(p.y - oy); };
        const free = SIDES.filter(sd => sd !== cur && !uses.get(n.id + '|' + sd) && sideOpen(n, sd) && !facesAway(n, sd, other))
          .sort((a, b) => score(a) - score(b));
        if (!free.length) return;
        bump(n, cur, -1); bump(n, free[0], 1);
        if (end === 's') e.sSide = free[0]; else e.tSide = free[0];
      };
      normal.forEach(e => { fanOut(e, 's'); fanOut(e, 't'); });
      assignPorts(normal);

      if (edgeStyle === 'straight') {
        normal.forEach(e => { e.pts = [e.P, e.Q]; });
        return;
      }

      const grid = buildGrid();
      const queue = [];
      normal.forEach(e => {
        const opposite = (e.sSide === 'right' && e.tSide === 'left') || (e.sSide === 'left' && e.tSide === 'right') ||
                         (e.sSide === 'bottom' && e.tSide === 'top') || (e.sSide === 'top' && e.tSide === 'bottom');
        const gap = e.sSide === 'right' ? e.Q.x - e.P.x : e.sSide === 'left' ? e.P.x - e.Q.x :
                    e.sSide === 'bottom' ? e.Q.y - e.P.y : e.P.y - e.Q.y;
        if (opposite && gap >= 0 && gap < 2 * STUB + G) { e.pts = simplify(zRoute(e.P, e.Q, e.sSide)); return; }
        e.S = stubPoint(e.P, e.sSide);
        e.T = stubPoint(e.Q, e.tSide);
        e.span = Math.abs(e.S.x - e.T.x) + Math.abs(e.S.y - e.T.y);
        queue.push(e);
      });
      queue.sort((a, b) => a.span - b.span || a.i - b.i);

      queue.forEach(e => {
        const sc = cellIndex(grid, e.S), tc = cellIndex(grid, e.T);
        // Terminal cells must be walkable even when a neighbour's halo covers them.
        [sc, tc].forEach(c => { if (c >= 0) { grid.blocked[c] = 0; grid.tight[c] = 0; } });
        const sDir = SIDE_DIR[e.sSide], tDir = (SIDE_DIR[e.tSide] + 2) & 3;
        // Prefer roomy clearance and a straight approach; loosen only when nothing fits.
        // Edges between two nodes of one group prefer to stay inside that group's box.
        const mask = e.src.group && e.src.group === e.tgt.group ? groupMask(grid, e.src.group) : null;
        const cells = findPath(grid, grid.blocked, sc, sDir, tc, tDir, false, mask) ||
                      findPath(grid, grid.blocked, sc, sDir, tc, tDir, true, mask) ||
                      findPath(grid, grid.tight, sc, sDir, tc, tDir, false, mask) ||
                      findPath(grid, grid.tight, sc, sDir, tc, tDir, true, mask);
        let pts;
        if (cells) {
          markUsed(grid, cells);
          pts = snapEnds(cellsToCorners(grid, cells), e.S, e.T);
          pts = orthogonalize([e.P].concat(pts, [e.Q]));
        } else {
          pts = [e.P].concat(zRoute(e.S, e.T, e.sSide), [e.Q]);
        }
        e.pts = simplify(pts);
      });
    }

    /* ====================================================================
       Edge labels: choose a spot clear of nodes, other labels and lines
       ==================================================================== */
    const rectsOverlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    function segHitsRect(a, b, r) {
      let t0 = 0, t1 = 1;
      const dx = b.x - a.x, dy = b.y - a.y;
      const p = [-dx, dx, -dy, dy], q = [a.x - r.x, r.x + r.w - a.x, a.y - r.y, r.y + r.h - a.y];
      for (let i = 0; i < 4; i++) {
        if (p[i] === 0) { if (q[i] < 0) return false; }
        else { const t = q[i] / p[i]; if (p[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; } else { if (t < t0) return false; if (t < t1) t1 = t; } }
      }
      return true;
    }
    const segmentsOf = pts => pts.slice(1).map((b, i) => ({ a: pts[i], b }));
    const pathLength = pts => segmentsOf(pts).reduce((s, sg) => s + Math.hypot(sg.b.x - sg.a.x, sg.b.y - sg.a.y), 0);

    function placeLabels() {
      const routed = model.edges.filter(e => e.pts && e.pts.length > 1);
      const obstacles = [];
      model.nodes.forEach(n => obstacles.push({ x: n.x - 2, y: n.y - 2, w: n.w + 4, h: n.h + 4 }));
      model.groups.forEach(g => obstacles.push({ x: g.x, y: g.y, w: g.label.length * 7 + 24, h: 22 }));
      const allSegs = [];
      routed.forEach(e => segmentsOf(e.pts).forEach(s => allSegs.push({ e, a: s.a, b: s.b })));
      const placed = [];
      routed.filter(e => e.label).sort((a, b) => pathLength(a.pts) - pathLength(b.pts)).forEach(e => {
        const w = e.label.length * 5.6 + 14, h = 16;
        let best = null;
        segmentsOf(e.pts).forEach(s => {
          const len = Math.hypot(s.b.x - s.a.x, s.b.y - s.a.y);
          const horiz = Math.abs(s.b.y - s.a.y) <= Math.abs(s.b.x - s.a.x);
          const need = (horiz ? w : h) + 24;
          [0.5, 0.35, 0.65, 0.22, 0.78].forEach(f => {
            if (len < need && f !== 0.5) return;
            const cx = s.a.x + (s.b.x - s.a.x) * f, cy = s.a.y + (s.b.y - s.a.y) * f;
            const rect = { x: cx - w / 2, y: cy - h / 2, w, h };
            let score = Math.abs(f - 0.5) * 24 - Math.min(len, 300) / 12 + (len < need ? 45 : 0);
            obstacles.forEach(o => { if (rectsOverlap(rect, o)) score += 1000; });
            placed.forEach(o => { if (rectsOverlap(rect, o)) score += 1000; });
            allSegs.forEach(sg => {
              if (sg.a === s.a && sg.b === s.b) return;
              if (segHitsRect(sg.a, sg.b, rect)) score += sg.e === e ? 25 : 90;
            });
            if (!best || score < best.score) best = { score, rect, cx, cy };
          });
        });
        if (best) { e.labelBox = best.rect; placed.push(best.rect); }
      });
    }

    /* ====================================================================
       Rendering
       ==================================================================== */
    const canvasGroup = document.getElementById('canvas-group');
    const layerGroups = document.getElementById('layer-groups');
    const layerEdges = document.getElementById('layer-edges');
    const layerNodes = document.getElementById('layer-nodes');
    const defsEl = document.getElementById('svg-defs');

    let transform = { x: 0, y: 0, scale: 1 };
    let userMoved = false;
    let particles = [];
    const nodeEls = new Map();      // id -> <g>
    const edgeEls = new Map();      // edge id -> { el, path, edge }
    let edgeStyle = 'orthogonal';
    let direction = 'LR';

    function svgEl(tag, attrs, parent) {
      const e = document.createElementNS(SVG_NS, tag);
      if (attrs) Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
      if (parent) parent.appendChild(e);
      return e;
    }

    function shapeGeometry(n) {
      const { x, y, w, h } = n;
      switch (n.shape) {
        case 'diamond':
          return { d: `M ${x + w / 2} ${y} L ${x + w} ${y + h / 2} L ${x + w / 2} ${y + h} L ${x} ${y + h / 2} Z`, round: false };
        case 'hexagon': {
          const k = h / 2;
          return { d: `M ${x + k} ${y} L ${x + w - k} ${y} L ${x + w} ${y + h / 2} L ${x + w - k} ${y + h} L ${x + k} ${y + h} L ${x} ${y + h / 2} Z`, round: false };
        }
        case 'cylinder': {
          const ry = 6, rx = w / 2;
          return {
            d: `M ${x} ${y + ry} A ${rx} ${ry} 0 0 1 ${x + w} ${y + ry} L ${x + w} ${y + h - ry} A ${rx} ${ry} 0 0 1 ${x} ${y + h - ry} Z`,
            cap: `M ${x} ${y + ry} A ${rx} ${ry} 0 0 0 ${x + w} ${y + ry}`, round: false
          };
        }
        default:
          return { rect: true, round: n.shape === 'pill' };
      }
    }

    function createNodeEl(n) {
      const g = svgEl('g', { class: 'node-container', id: 'node-' + n.id });
      g.dataset.id = n.id;
      g.style.setProperty('--kc', kindVar(n.kind));
      const geo = shapeGeometry(n);
      const mk = cls => {
        let s;
        if (geo.rect) {
          s = svgEl('rect', { class: cls, x: n.x, y: n.y, width: n.w, height: n.h });
          if (geo.round) s.style.rx = (n.h / 2) + 'px';
        } else {
          s = svgEl('path', { class: cls, d: geo.d });
        }
        return s;
      };
      g.appendChild(mk('node-rect'));
      g.appendChild(mk('node-tint'));
      if (geo.cap) svgEl('path', { class: 'node-cap', d: geo.cap }, g);

      const inset = n.shape === 'hexagon' ? 22 : n.shape === 'pill' ? 14 : 10;
      const hasIcon = n.shape !== 'diamond';
      const iconSize = 16, cy = n.y + n.h / 2 + (n.shape === 'cylinder' ? 3 : 0);
      if (hasIcon) {
        const addKindIcon = () => {
          const icon = svgEl('svg', {
            x: n.x + inset, y: cy - iconSize / 2, width: iconSize, height: iconSize, viewBox: '0 0 24 24',
            fill: 'none', 'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round'
          });
          icon.style.stroke = kindVar(n.kind);
          icon.innerHTML = KIND_ICONS[n.kind] || KIND_ICONS.default;
          return icon;
        };
        if (n.logo) {
          const img = svgEl('image', { href: n.logo, x: n.x + inset, y: cy - iconSize / 2, width: iconSize, height: iconSize }, g);
          // White simpleicons logos vanish on light themes; the theme's --logo-filter fixes that.
          if (/simpleicons\.org\/[^/]+\/(ffffff|fff)\/?$/i.test(n.logo)) img.setAttribute('class', 'logo-mono');
          // A dead logo URL falls back to the kind icon instead of a broken-image box.
          img.addEventListener('error', () => { img.replaceWith(addKindIcon()); });
        } else {
          g.appendChild(addKindIcon());
        }
      }
      const text = svgEl('text', {
        class: 'node-label',
        x: hasIcon ? n.x + inset + iconSize + 6 : n.x + n.w / 2,
        y: cy + 4
      }, g);
      if (!hasIcon) text.setAttribute('text-anchor', 'middle');
      text.textContent = n.label;
      return g;
    }

    function ensureMarker(color) {
      const id = 'arrow-c-' + color.replace(/[^a-z0-9]/gi, '');
      if (!document.getElementById(id)) {
        const m = svgEl('marker', { id, viewBox: '0 0 10 10', refX: 10, refY: 5, markerWidth: 9, markerHeight: 9, markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse' }, defsEl);
        const p = svgEl('path', { d: 'M 0 1 L 10 5 L 0 9 z' }, m);
        p.style.fill = color;
      }
      return id;
    }

    function roundedPath(pts, r) {
      let d = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 1; i < pts.length - 1; i++) {
        const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
        const l1 = Math.hypot(p1.x - p0.x, p1.y - p0.y), l2 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const rr = Math.min(r, l1 / 2, l2 / 2);
        if (rr < 0.5) { d += ` L ${p1.x} ${p1.y}`; continue; }
        const a = { x: p1.x + (p0.x - p1.x) / l1 * rr, y: p1.y + (p0.y - p1.y) / l1 * rr };
        const b = { x: p1.x + (p2.x - p1.x) / l2 * rr, y: p1.y + (p2.y - p1.y) / l2 * rr };
        d += ` L ${a.x} ${a.y} Q ${p1.x} ${p1.y} ${b.x} ${b.y}`;
      }
      const last = pts[pts.length - 1];
      return d + ` L ${last.x} ${last.y}`;
    }

    function renderEdges() {
      layerEdges.innerHTML = '';
      edgeEls.clear();
      particles = [];
      routeEdges(edgeStyle);
      placeLabels();
      model.edges.forEach(e => {
        if (!e.pts) return;
        const g = svgEl('g', { class: 'edge-container', id: e.id }, layerEdges);
        g.dataset.source = e.source; g.dataset.target = e.target;
        const path = svgEl('path', { class: 'edge-path' + (e.line !== 'solid' ? ' ' + e.line : ''), d: roundedPath(e.pts, CORNER_RADIUS[edgeStyle]) }, g);
        const markerId = e.color ? ensureMarker(e.color) : 'arrow';
        e.markerId = markerId;
        path.setAttribute('marker-end', 'url(#' + markerId + ')');
        if (e.bidir) path.setAttribute('marker-start', 'url(#' + markerId + ')');
        if (e.color) path.style.setProperty('--edge-color', e.color);
        if (e.labelBox) {
          const b = e.labelBox;
          svgEl('rect', { class: 'edge-label-bg', x: b.x, y: b.y, width: b.w, height: b.h }, g);
          svgEl('text', { class: 'edge-label-text', x: b.x + b.w / 2, y: b.y + b.h / 2 + 0.5 }, g).textContent = e.label;
        }
        const len = path.getTotalLength();
        const count = len > 420 ? 3 : 2;
        for (let p = 0; p < count; p++) {
          const dot = svgEl('circle', { class: 'particle', r: 2.2 }, g);
          dot.style.fill = e.color || kindVar(e.tgt.kind);
          dot.style.color = e.color || kindVar(e.tgt.kind);
          dot.style.opacity = 0;
          particles.push({ el: dot, path, len, edge: e, offset: (p + Math.random() * 0.4) / count });
        }
        edgeEls.set(e.id, { el: g, path, edge: e });
      });
      refreshFocus();
    }

    function renderCanvas() {
      layerGroups.innerHTML = ''; layerNodes.innerHTML = '';
      nodeEls.clear();
      model.groups.forEach(g => {
        const ge = svgEl('g', { class: 'group-container', id: 'group-' + g.id }, layerGroups);
        const rect = svgEl('rect', { class: 'group-box', x: g.x, y: g.y, width: g.w, height: g.h }, ge);
        const label = svgEl('text', { class: 'group-label', x: g.x + 12, y: g.y + 16 }, ge);
        label.textContent = g.label;
        if (g.color) {
          // A kind name ("store") uses the theme's colour for it; anything else is a raw CSS colour.
          const rk = resolveKind(g.color);
          const c = rk !== 'default' ? kindVar(rk) : g.color;
          rect.style.stroke = c; label.style.fill = c;
        }
      });
      const all = [];
      model.groups.forEach(g => g.nodes.forEach(n => all.push(n)));
      model.standalone.forEach(n => all.push(n));
      all.forEach(n => {
        const el = createNodeEl(n);
        layerNodes.appendChild(el);
        nodeEls.set(n.id, el);
        bindNodeEvents(el, n);
      });
      renderEdges();
    }

    /* ====================================================================
       Focus / highlight
       ==================================================================== */
    let pinned = null;          // { nodes:Set, edges:Set } from story / legend / click
    let hovered = null;
    let pinnedNode = null;
    let storyIndex = -1;

    function neighbourhood(id) {
      const nodes = new Set([id]), edges = new Set();
      model.edges.forEach(e => {
        if (!e.pts) return;
        if (e.source === id) { nodes.add(e.target); edges.add(e.id); }
        if (e.target === id) { nodes.add(e.source); edges.add(e.id); }
      });
      return { nodes, edges };
    }
    function focusOfIds(ids) {
      const expanded = new Set();
      ids.forEach(id => {
        const g = model.groups.find(gr => gr.id === id);
        if (g) g.nodes.forEach(n => expanded.add(n.id));
        else if (model.nodes.has(id)) expanded.add(id);
      });
      const edges = new Set();
      model.edges.forEach(e => { if (e.pts && expanded.has(e.source) && expanded.has(e.target)) edges.add(e.id); });
      return { nodes: expanded, edges };
    }

    function refreshFocus() {
      const f = hovered ? neighbourhood(hovered) : pinned;
      nodeEls.forEach((el, id) => {
        el.classList.toggle('dimmed', !!f && f.nodes.size > 0 && !f.nodes.has(id));
        el.classList.toggle('selected', !hovered && pinnedNode === id);
      });
      edgeEls.forEach((rec, id) => {
        const lit = !!f && f.edges.has(id);
        const dim = !!f && f.nodes.size > 0 && !lit;
        rec.el.classList.toggle('dimmed', dim);
        rec.el.classList.toggle('active', lit);
        if (!rec.edge.color) {
          const m = lit ? 'arrow-active' : 'arrow';
          rec.path.setAttribute('marker-end', 'url(#' + m + ')');
          if (rec.edge.bidir) rec.path.setAttribute('marker-start', 'url(#' + m + ')');
        }
        rec.edge.dim = dim; rec.edge.lit = lit;
      });
    }

    function setPinned(f, nodeId) { pinned = f; pinnedNode = nodeId || null; refreshFocus(); }

    function resetFocus(refit) {
      pinned = null; pinnedNode = null; hovered = null; storyIndex = -1;
      document.querySelectorAll('.story-step, .legend-item').forEach(el => el.classList.remove('active'));
      stopStory();
      refreshFocus();
      hideTooltip();
      if (refit) fitView(true);
    }

    /* ====================================================================
       Tooltip + node events
       ==================================================================== */
    const tooltip = document.getElementById('tooltip');
    function showTooltip(n, ev) {
      tooltip.innerHTML = '';
      const add = (cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = text; tooltip.appendChild(d); return d; };
      add('tt-title', n.label);
      const k = add('tt-kind', n.kind === 'default' ? 'node' : n.kind);
      k.style.color = kindVar(n.kind);
      if (n.desc) add('tt-desc', n.desc);
      const ins = model.edges.filter(e => e.pts && e.target === n.id).length;
      const outs = model.edges.filter(e => e.pts && e.source === n.id).length;
      add('tt-meta', ins + ' in  ·  ' + outs + ' out' + (n.group ? '  ·  ' + n.group.label : ''));
      if (n.tags.length) {
        const row = document.createElement('div'); row.className = 'tt-tags';
        n.tags.forEach(t => { const s = document.createElement('span'); s.className = 'tt-tag'; s.textContent = t; row.appendChild(s); });
        tooltip.appendChild(row);
      }
      tooltip.classList.add('show');
      moveTooltip(ev);
    }
    function moveTooltip(ev) {
      const pad = 16, w = tooltip.offsetWidth, h = tooltip.offsetHeight;
      let x = ev.clientX + pad, y = ev.clientY + pad;
      if (x + w > window.innerWidth - 8) x = ev.clientX - w - pad;
      if (y + h > window.innerHeight - 8) y = ev.clientY - h - pad;
      tooltip.style.left = Math.max(8, x) + 'px'; tooltip.style.top = Math.max(8, y) + 'px';
    }
    function hideTooltip() { tooltip.classList.remove('show'); }

    function bindNodeEvents(el, n) {
      el.addEventListener('pointerenter', ev => {
        if (ev.pointerType !== 'mouse' || dragging) return;
        hovered = n.id; refreshFocus(); showTooltip(n, ev);
      });
      el.addEventListener('pointermove', ev => { if (hovered === n.id) moveTooltip(ev); });
      el.addEventListener('pointerleave', () => { if (hovered === n.id) { hovered = null; refreshFocus(); } hideTooltip(); });
      el.addEventListener('click', ev => {
        ev.stopPropagation();
        if (dragMoved > 5) return;
        document.querySelectorAll('.story-step, .legend-item').forEach(x => x.classList.remove('active'));
        stopStory(); storyIndex = -1;
        if (pinnedNode === n.id) setPinned(null, null);
        else setPinned(neighbourhood(n.id), n.id);
      });
    }

    /* ====================================================================
       Sidebar: legend + story
       ==================================================================== */
    function buildLegend() {
      const div = document.getElementById('tab-legend');
      div.innerHTML = '';
      const counts = new Map();
      model.nodes.forEach(n => counts.set(n.kind, (counts.get(n.kind) || 0) + 1));
      Array.from(counts.keys()).sort().forEach(kind => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = '<div class="legend-dot"></div><span></span><span class="legend-count"></span>';
        item.children[0].style.background = kindVar(kind);
        item.children[1].textContent = (kind === 'default' ? 'other' : kind).toUpperCase();
        item.children[2].textContent = counts.get(kind);
        item.addEventListener('click', () => {
          const wasActive = item.classList.contains('active');
          document.querySelectorAll('.story-step, .legend-item').forEach(x => x.classList.remove('active'));
          stopStory(); storyIndex = -1;
          if (wasActive) { setPinned(null, null); return; }
          item.classList.add('active');
          setPinned(focusOfIds(Array.from(model.nodes.values()).filter(n => n.kind === kind).map(n => n.id)), null);
        });
        div.appendChild(item);
      });
      const hint = document.createElement('div');
      hint.className = 'legend-hint';
      hint.textContent = 'Hover a node to trace its connections. Click to pin. Scroll to zoom, drag to pan. Arrow keys step through the story.';
      div.appendChild(hint);
    }

    let storyTimer = null;
    function stopStory() {
      if (storyTimer) { clearInterval(storyTimer); storyTimer = null; }
      const b = document.getElementById('story-play'); if (b) b.textContent = '▶ Play';
    }
    function gotoStep(i) {
      const steps = vizData.steps || [];
      if (!steps.length) return;
      storyIndex = (i + steps.length) % steps.length;
      document.querySelectorAll('.legend-item').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.story-step').forEach((el, k) => el.classList.toggle('active', k === storyIndex));
      const f = focusOfIds(steps[storyIndex].highlight || []);
      setPinned(f.nodes.size ? f : null, null);
      const active = document.getElementById('step-' + storyIndex);
      if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', behavior: REDUCED_MOTION ? 'auto' : 'smooth' });
      if (f.nodes.size) fitToNodes(Array.from(f.nodes));
    }
    function buildStory() {
      const div = document.getElementById('tab-story');
      div.innerHTML = '';
      const steps = vizData.steps || [];
      if (!steps.length) { div.innerHTML = '<div class="step-desc">No story steps defined.</div>'; return; }
      const ctl = document.createElement('div');
      ctl.className = 'story-controls';
      ctl.innerHTML = '<button class="story-btn" id="story-prev">◀ Prev</button><button class="story-btn" id="story-play">▶ Play</button><button class="story-btn" id="story-next">Next ▶</button>';
      div.appendChild(ctl);
      ctl.querySelector('#story-prev').addEventListener('click', () => { stopStory(); gotoStep(storyIndex < 0 ? steps.length - 1 : storyIndex - 1); });
      ctl.querySelector('#story-next').addEventListener('click', () => { stopStory(); gotoStep(storyIndex + 1); });
      ctl.querySelector('#story-play').addEventListener('click', () => {
        if (storyTimer) { stopStory(); return; }
        document.getElementById('story-play').textContent = '❚❚ Pause';
        gotoStep(storyIndex + 1);
        storyTimer = setInterval(() => gotoStep(storyIndex + 1), 3600);
      });
      steps.forEach((step, idx) => {
        const item = document.createElement('div');
        item.className = 'story-step'; item.id = 'step-' + idx;
        const title = document.createElement('div'); title.className = 'step-title'; title.textContent = (idx + 1) + '. ' + String(step.title || '').replace(/^\d+\.\s*/, '');
        const desc = document.createElement('div'); desc.className = 'step-desc'; desc.textContent = step.description || '';
        item.appendChild(title); item.appendChild(desc);
        item.addEventListener('click', () => { stopStory(); gotoStep(idx); });
        div.appendChild(item);
      });
    }

    /* ====================================================================
       Pan / zoom
       ==================================================================== */
    const container = document.getElementById('canvas-container');
    let tweenId = 0, dragging = false, dragMoved = 0;
    const pointers = new Map();
    let dragStart = null, pinchStart = null;

    function updateTransform() {
      canvasGroup.setAttribute('transform', `translate(${transform.x}, ${transform.y}) scale(${transform.scale})`);
    }
    function animateTo(target, ms) {
      const id = ++tweenId;
      if (REDUCED_MOTION || !ms) { transform = Object.assign({}, target); updateTransform(); return; }
      const from = Object.assign({}, transform), t0 = performance.now();
      const step = now => {
        if (id !== tweenId) return;
        const t = Math.min(1, (now - t0) / ms), k = 1 - Math.pow(1 - t, 3);
        transform = { x: from.x + (target.x - from.x) * k, y: from.y + (target.y - from.y) * k, scale: from.scale + (target.scale - from.scale) * k };
        updateTransform();
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
    function zoomAt(cx, cy, factor, animate) {
      const s = Math.min(Math.max(0.1, transform.scale * factor), 4);
      const k = s / transform.scale;
      animateTo({ x: cx - (cx - transform.x) * k, y: cy - (cy - transform.y) * k, scale: s }, animate ? 250 : 0);
    }
    function fitBounds(b, ms, maxScale) {
      const sidebar = document.getElementById('sidebar').classList.contains('open') ? 300 : 0;
      const availW = window.innerWidth - sidebar, availH = window.innerHeight;
      const pad = 90;
      let scale = Math.min((availW - pad * 2) / b.w, (availH - pad * 2) / b.h, maxScale || 1);
      if (!(scale > 0)) scale = 1;
      scale = Math.max(scale, 0.1);
      animateTo({
        x: sidebar + (availW - b.w * scale) / 2 - b.x * scale,
        y: (availH - b.h * scale) / 2 - b.y * scale,
        scale
      }, ms);
    }
    function contentBounds() {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      const grow = (x, y, w, h) => { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h); };
      model.groups.forEach(g => grow(g.x, g.y, g.w, g.h));
      model.nodes.forEach(n => grow(n.x, n.y, n.w, n.h));
      model.edges.forEach(e => { if (e.pts) e.pts.forEach(p => grow(p.x, p.y, 0, 0)); });
      if (minX === Infinity) return { x: 0, y: 0, w: 100, h: 100 };
      return { x: minX, y: minY, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) };
    }
    function fitView(animate) { userMoved = false; fitBounds(contentBounds(), animate ? 600 : 0, 1); }
    function fitToNodes(ids) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      ids.forEach(id => { const n = model.nodes.get(id); if (!n) return; minX = Math.min(minX, n.x); minY = Math.min(minY, n.y); maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h); });
      if (minX === Infinity) return;
      fitBounds({ x: minX, y: minY, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) }, 700, 1.4);
    }

    function setupPanZoom() {
      container.addEventListener('wheel', ev => {
        ev.preventDefault(); userMoved = true; tweenId++;
        zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0015)), false);
      }, { passive: false });

      container.addEventListener('pointerdown', ev => {
        if (ev.pointerType === 'mouse' && ev.button !== 0) return;
        pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
        tweenId++;
        if (pointers.size === 1) { dragStart = { x: ev.clientX - transform.x, y: ev.clientY - transform.y }; dragMoved = 0; }
        if (pointers.size === 2) {
          const [a, b] = Array.from(pointers.values());
          pinchStart = { dist: Math.hypot(a.x - b.x, a.y - b.y), scale: transform.scale, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, tx: transform.x, ty: transform.y };
        }
      });
      window.addEventListener('pointermove', ev => {
        if (!pointers.has(ev.pointerId)) return;
        const prev = pointers.get(ev.pointerId);
        dragMoved += Math.abs(ev.clientX - prev.x) + Math.abs(ev.clientY - prev.y);
        pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
        if (dragMoved > 5) { dragging = true; userMoved = true; container.classList.add('panning'); hideTooltip(); }
        if (pointers.size === 1 && dragStart && dragging) {
          transform.x = ev.clientX - dragStart.x; transform.y = ev.clientY - dragStart.y; updateTransform();
        } else if (pointers.size === 2 && pinchStart) {
          const [a, b] = Array.from(pointers.values());
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          const s = Math.min(Math.max(0.1, pinchStart.scale * dist / pinchStart.dist), 4);
          const k = s / pinchStart.scale;
          transform = { scale: s, x: pinchStart.cx - (pinchStart.cx - pinchStart.tx) * k, y: pinchStart.cy - (pinchStart.cy - pinchStart.ty) * k };
          updateTransform();
        }
      });
      const end = ev => {
        pointers.delete(ev.pointerId);
        if (pointers.size < 2) pinchStart = null;
        if (pointers.size === 0) { dragging = false; container.classList.remove('panning'); dragStart = null; }
        else if (pointers.size === 1) { const p = Array.from(pointers.values())[0]; dragStart = { x: p.x - transform.x, y: p.y - transform.y }; }
      };
      window.addEventListener('pointerup', end);
      window.addEventListener('pointercancel', end);

      // Click on empty canvas clears focus (ignored after a drag)
      container.addEventListener('click', ev => {
        if (dragMoved > 5) return;
        if (ev.target.closest && ev.target.closest('.node-container')) return;
        if (pinned || pinnedNode) resetFocus(false);
      });

      document.getElementById('zoom-in').addEventListener('click', () => { userMoved = true; zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1.25, true); });
      document.getElementById('zoom-out').addEventListener('click', () => { userMoved = true; zoomAt(window.innerWidth / 2, window.innerHeight / 2, 0.8, true); });
      document.getElementById('zoom-fit').addEventListener('click', () => fitView(true));
      window.addEventListener('resize', () => { if (!userMoved) fitView(false); });
    }

    /* ====================================================================
       Particles & entry animation
       ==================================================================== */
    let lastFrame = 0;
    function animateParticles(now) {
      const dt = Math.min(64, now - (lastFrame || now)); lastFrame = now;
      particles.forEach(p => {
        if (p.edge.dim || REDUCED_MOTION) { p.el.style.opacity = 0; return; }
        const speed = p.edge.lit ? 110 : 70;                       // px per second
        p.offset = (p.offset + dt * speed / 1000 / p.len) % 1;
        const pt = p.path.getPointAtLength(p.offset * p.len);
        p.el.setAttribute('cx', pt.x); p.el.setAttribute('cy', pt.y);
        const o = p.offset;
        p.el.style.opacity = Math.min(1, o * 8, (1 - o) * 8) * (p.edge.lit ? 1 : 0.85);
      });
      requestAnimationFrame(animateParticles);
    }

    function runEntryAnimation() {
      if (REDUCED_MOTION) return;
      // CSS opacity transitions would fight the tween, so pause them meanwhile.
      document.body.classList.add('entering');
      const tl = gsap.timeline();
      tl.from('.group-container', { opacity: 0, y: 16, duration: 0.5, stagger: 0.08, ease: 'power2.out' });
      tl.from('.node-container', { opacity: 0, scale: 0.6, duration: 0.5, stagger: 0.02, ease: 'back.out(1.4)' }, '-=0.2');
      const paths = document.querySelectorAll('.edge-path');
      const dashed = [];
      paths.forEach(p => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
        dashed.push(p);
      });
      tl.to('.edge-path', { strokeDashoffset: 0, duration: 0.9, stagger: 0.04, ease: 'power2.inOut' }, '-=0.4');
      tl.from('.edge-label-bg, .edge-label-text', { opacity: 0, duration: 0.4 }, '-=0.5');
      tl.call(() => {
        dashed.forEach(p => { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; });
        document.body.classList.remove('entering');
      });
    }

    /* ====================================================================
       Controls & boot
       ==================================================================== */
    function setupControls() {
      const sidebar = document.getElementById('sidebar');
      document.getElementById('sidebar-toggle').addEventListener('click', () => {
        sidebar.classList.toggle('open');
        if (!userMoved) setTimeout(() => fitView(true), 50);
      });
      document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      }));

      const themeSel = document.getElementById('theme-select');
      populateThemeSelect(themeSel, document.body.getAttribute('data-theme'));
      themeSel.addEventListener('change', () => document.body.setAttribute('data-theme', themeSel.value));

      const edgeSel = document.getElementById('edge-select');
      edgeSel.value = edgeStyle;
      edgeSel.addEventListener('change', () => { edgeStyle = edgeSel.value; renderEdges(); });

      const nodeSel = document.getElementById('node-select');
      nodeSel.value = document.body.getAttribute('data-node-style');
      nodeSel.addEventListener('change', () => document.body.setAttribute('data-node-style', nodeSel.value));

      document.getElementById('btn-fit').addEventListener('click', () => fitView(true));
      document.getElementById('btn-reset').addEventListener('click', () => resetFocus(true));

      window.addEventListener('keydown', ev => {
        if (ev.target && /^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName)) return;
        if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') { stopStory(); gotoStep(storyIndex + 1); ev.preventDefault(); }
        else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') { stopStory(); gotoStep(storyIndex < 0 ? -1 : storyIndex - 1); ev.preventDefault(); }
        else if (ev.key === 'Escape') resetFocus(true);
        else if (ev.key === '0' || ev.key === 'f') fitView(true);
      });
    }

    function init() {
      const project = vizData.project || {};
      const theme = resolveTheme(project.theme);
      document.body.setAttribute('data-theme', theme);
      if (NODE_STYLES.indexOf(project.nodeStyle) !== -1) document.body.setAttribute('data-node-style', project.nodeStyle);
      if (EDGE_STYLES.indexOf(project.edgeStyle) !== -1) edgeStyle = project.edgeStyle;
      direction = /^(tb|top|vertical|down)/i.test(project.direction || '') ? 'TB' : 'LR';

      const nameEl = document.querySelector('.project-name');
      if (nameEl.textContent === 'Uber Architecture') {
        nameEl.textContent = project.name || 'Architecture';
        document.querySelector('.project-desc').textContent = project.description || 'System Map';
      }

      buildModel(vizData);
      layoutModel(direction);
      renderCanvas();
      buildLegend();
      buildStory();
      setupControls();
      setupPanZoom();
      fitView(false);
      runEntryAnimation();
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
