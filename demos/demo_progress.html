    /*
  VizCraft shared themes
  ----------------------
  Injected into every template at generate time (see generate.py).

  To add a theme:
    1. Add a block below with a `@theme <id> | <Label>` marker comment.
    2. Define at least the core tokens (bg / surface / border / text / accent).
    3. Done. generate.py discovers the marker and the theme picker, the
       validator and SKILL.md-listed names all pick it up from here.

  Tokens
    --bg-color --surface-color --border-color --text-main --text-muted
    --accent --complete-color            core palette
    --group-fill --node-fill --node-stroke   architecture surfaces
    --dot-color                          background grid dots
    --kind-<kind>                        node colours (architecture)
    --phase-1..6                         phase colours (progress)
*/

:root {
  --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
  --font-mono: 'Space Mono', monospace;

  /* Default kind palette (dark backgrounds) */
  --kind-entry: #3b82f6;
  --kind-agent: #f59e0b;
  --kind-service: #8b5cf6;
  --kind-store: #10b981;
  --kind-external: #06b6d4;
  --kind-model: #ec4899;
  --kind-cron: #f97316;
  --kind-tool: #84cc16;
  --kind-queue: #d946ef;
  --kind-gateway: #14b8a6;
  --kind-client: #60a5fa;
  --kind-cache: #facc15;
  --kind-function: #fb7185;
  --kind-user: #cbd5e1;
  --kind-monitor: #818cf8;
  --kind-security: #ef4444;
  --kind-default: #7a7f87;
}

/* Derived tokens: resolved on <body> so they follow the active theme. */
body {
  --track-bg: rgba(128, 128, 128, 0.18);
  --hover-bg: rgba(128, 128, 128, 0.12);
  --phase-1: var(--kind-entry);
  --phase-2: var(--kind-service);
  --phase-3: var(--kind-store);
  --phase-4: var(--kind-agent);
  --phase-5: var(--kind-model);
  --phase-6: var(--kind-external);
}

    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::selection { background: var(--accent); color: var(--bg-color); }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      transition: background-color 0.5s var(--ease-smooth), color 0.5s var(--ease-smooth);
    }

    /* Ambient background glows */
    .bg-glow, .bg-glow-2 { position: absolute; border-radius: 50%; z-index: 0; pointer-events: none; }
    .bg-glow {
      width: 60vw; height: 60vw; top: -30vh; left: -20vw;
      background: radial-gradient(circle, var(--phase-1) 0%, transparent 70%);
      opacity: 0.09;
      animation: float 20s ease-in-out infinite alternate;
    }
    .bg-glow-2 {
      width: 50vw; height: 50vw; bottom: -20vh; right: -10vw;
      background: radial-gradient(circle, var(--phase-2) 0%, transparent 70%);
      opacity: 0.07;
      animation: float-rev 25s ease-in-out infinite alternate;
    }
    @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(10vw, 10vh); } }
    @keyframes float-rev { 0% { transform: translate(0, 0); } 100% { transform: translate(-10vw, -15vh); } }

    /* ---- Main area ---- */
    #main-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: auto;
      padding: 60px;
      padding-left: 100px;
      transition: padding-left 0.7s var(--ease-smooth);
    }
    #main-container.sidebar-open { padding-left: 380px; }
    #phases-viewport { transform-origin: top left; transition: transform 0.4s var(--ease-smooth); }
    .phases-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 32px;
      padding-bottom: 80px;
    }

    .phase-card {
      background: var(--surface-color);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 28px;
      position: relative;
      transition: border-color 0.4s var(--ease-smooth), box-shadow 0.4s var(--ease-smooth), translate 0.4s var(--ease-smooth);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.35);
    }
    /* Initial hidden state; removed once the entry animation has run */
    .phase-card.pre { opacity: 0; transform: translateY(40px); }
    .phase-card:hover { translate: 0 -5px; box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.45); border-color: var(--phase-color, var(--text-muted)); }
    .phase-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--phase-color, var(--text-muted)), transparent);
      opacity: 0.6;
      border-radius: 16px 16px 0 0;
    }
    .phase-card.completed { box-shadow: 0 0 40px -10px var(--complete-color); }

    .complete-badge {
      position: absolute;
      top: -12px; right: 24px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      background: var(--complete-color);
      color: #000;
      padding: 4px 12px;
      border-radius: 20px;
      opacity: 0;

n middleware, and automated driver KYC document verification pipelines.", "tip": "Enforce strict rate limiting per phone number and IP on all OTP initiation endpoints to mitigate SMS toll fraud and bot exhaustion attacks. Isolate rider and driver role claims within cryptographically signed JWT payloads to prevent privilege escalation at the API gateway layer. Use presigned S3/GCS upload URLs with expiring signatures for driver identity documents so sensitive PII never traverses application server memory unencrypted.", "tasks": [{"id": "otp-twilio", "title": "Passwordless Phone Authentication with Twilio Verify", "note": "Develop passwordless authentication endpoints POST /api/v1/auth/otp/send and POST /api/v1/auth/otp/verify using the Twilio Verify v2 REST API. Enforce E.164 phone number formatting via Google's libphonenumber library before dispatching 6-digit numeric verification codes. Implement a sliding window rate limiter in Redis allowing a maximum of 3 OTP requests per phone number every 10 minutes and 10 requests per IP address per hour to stop SMS pumping exploits. Handle edge cases such as invalid country codes, carrier lookup failures, expired tokens (10-minute TTL), and max-retry verification lockouts. On successful verification, upsert the user record in PostgreSQL and return an initial authentication payload containing user ID, role, and onboarding completion status."}, {"id": "jwt-middleware", "title": "Stateless JWT Authentication & Role-Based Access Control", "note": "Implement asymmetric RS256 or Ed25519 JWT token generation with dual-token architecture consisting of short-lived access tokens (15-minute expiration) and rotating refresh tokens (30-day expiration stored in HTTP-only, Secure, SameSite=Strict cookies). Build middleware guards to inspect Authorization Bearer headers, decode claims (sub, role, device_id, iss, exp), and inject verified user contexts into downstream handler scopes. Store cryptographic token revocation fingerprints in a Redis blacklist with TTL matching the remaining token lifetime for immediate session invalidation upon logout. Enforce granular Role-Based Access Control (RBAC) across rider, driver, and platform admin endpoints with dedicated permission decorators. Implement automated refresh flow via POST /api/v1/auth/refresh with token reuse detection to trigger instant family revocation if a compromised refresh token is replayed."}, {"id": "driver-document-verification", "title": "Driver KYC & Document Upload Verification Pipeline", "note": "Create the driver onboarding workflow with endpoints POST /api/v1/drivers/documents/presigned-url and POST /api/v1/drivers/documents/submit for driver license, vehicle registration, and commercial insurance uploads. Generate pre-signed S3 upload URLs with client-side SHA-256 checksum validation and a strict 5-minute expiry to keep uploads direct and secure. Store document metadata, expiration dates, OCR text extraction results, and verification statuses (PENDING, APPROVED, REJECTED, EXPIRED) in the 'driver_documents' table. Integrate asynchronous webhook triggers with automated KYC providers (e.g., Persona or Stripe Identity) to verify driver identity and driving history against government databases. Handle edge cases such as blurry image rejections, mismatched document names, and automated expiration warnings dispatched 30 days prior to driver license lapse."}]}, {"id": "phase-3-ride-matching-engine", "title": "Phase 3: High-Concurrency Ride Matching & Dynamic Pricing Engine", "description": "Implement geospatial indexing for active drivers, atomic ride request queueing with lockouts and timeouts, and multi-variable dynamic fare calculation algorithms.", "tip": "Use Redis distributed locks (Redlock or SETNX with UUID owner tokens) during driver assignment to guarantee that a single driver cannot be concurrently dispatched to multiple simultaneous trip requests. Calibrate geospatial search radius expansions in tiered batches (e.g., 1km, 3km, 5km) to balance dispatch latency against network roundtrips. Ensure the fare calculation engine calculates and locks upfront price guarantees with cryptographic nonces to prevent rider disputes caused by transient surge fluctuations.", "tasks": [{"id": "redis-geospatial-driver-index", "title": "Redis Geospatial Driver Presence Index & Heartbeat Engine", "note": "Build high-frequency driver location ingestion endpoints via WebSocket and POST /api/v1/drivers/location executing Redis GEOADD operations on spatial keys ('drivers:available:<city_id>'). Maintain driver state machines (OFFLINE, AVAILABLE, EN_ROUTE_PICKUP, ON_TRIP) in Redis hashes with TTL-backed heartbeat keys that automatically mark drivers OFFLINE if no ping is received within 15 seconds. Implement spatial proximity queries using GEORADIUSBYMEMBER or GEOSEARCH with WITHDIST and WITHCOORD flags to return the top N nearest available drivers sorted by geodesic distance. Cluster spatial keys using H3 hexagonal hierarchical spatial indices or geohash prefixes to eliminate lock contention across distinct metropolitan dispatch zones. Handle edge cases such as rapid GPS drift, duplicate coordinate packets, and tunnel re-entry bursts using Kalman filter smoothing algorithms."}, {"id": "trip-request-queue", "title": "Atomic Trip Request Dispatch Queue & Driver Accept Timeout", "note": "Construct an asynchronous dispatch pipeline with POST /api/v1/trips/request which creates a TRIP_REQUESTED record and pushes the dispatch job to a BullMQ or Celery Redis queue. Implement an atomic driver-offering loop that reserves the nearest candidate driver using Redis SETNX with a 15-second expiration lease and pushes an interactive offer card to the driver's device. If the driver declines or the 15-second TTL expires without an ACCEPT response, release the lock, record the rejection in the dispatch audit log, and cascade the offer to the next closest driver in the spatial candidate list. Limit matching attempts to a maximum of 5 cascading driver iterations or a global 90-second timeout before updating the trip status to NO_DRIVERS_AVAILABLE and notifying the rider. Ensure transactional atomicity via PostgreSQL SELECT FOR UPDATE or Redis Lua scripts during the final trip confirmation transition to prevent race conditions."}, {"id": "fare-calculation", "title": "Dynamic Upfront Pricing, Surge Multiplier & ETA Estimation Engine", "note": "Develop the pricing calculation service at POST /api/v1/trips/estimate-fare utilizing OpenStreetMap/OSRM or Google Maps Distance Matrix APIs for accurate travel duration and route distance. Calculate base fares using the formula: Base Fare + (Estimated Minutes * Per-Minute Rate) + (Estimated Distance * Per-Mile Rate) + Airport/Toll Surcharges. Calculate dynamic surge multipliers in real-time by computing the ratio of active rider demand pings to available drivers within localized H3 hex cells over 5-minute rolling windows. Generate a signed fare token (HMAC-SHA256 containing trip parameters, estimated fare, surge tier, and timestamp) with a 5-minute validity window for the rider to accept. Handle edge cases such as sudden route recalculation, mid-trip destination changes, and minimum cancellation fee rules enforced when a rider cancels 2+ minutes after driver acceptance."}]}, {"id": "phase-4-stripe-payments", "title": "Phase 4: Stripe Connect Escrow, Payouts & Resilient Webhooks", "description": "Architect multi-party marketplace payments using Stripe Connect Custom/Express accounts, two-step authorization holds and captures, and idempotent webhook handlers.", "tip": "Always execute payment authorization holds at the moment of ride booking and only capture the final charge upon trip completion to account for tolls, tips, and route changes. Store all financial transactions in an immutable, append-only double-entry ledger table within PostgreSQL to simplify reconciliation against Stripe payout balances. Guard every incoming Stripe webhook against replay attacks by enforcing raw body cryptographic signature verification and database-backed idempotency event keys.", "tasks": [{"id": "stripe-connect-express", "title": "Stripe Connect Express Onboarding & Split Payment Configuration", "note": "Integrate the Stripe Connect API to provision Express or Custom connected accounts for drivers via POST /api/v1/drivers/stripe/onboarding-link using the stripe.accountLinks.create SDK method. Store the resulting Stripe Account ID ('acct_xxx'), onboarding status, charges_enabled, and payouts_enabled flags in the driver profile table. Configure destination charges or separate charge and transfer architecture specifying the platform application fee percentage (e.g., 20% platform take-rate) and automated payout schedules. Implement endpoints for drivers to query their balance, payout history, and access the Stripe Express dashboard via single-sign-on login links (stripe.accounts.createLoginLink). Handle edge cases including onboarding drop-offs, country-specific KYC compliance requirements, and restricted capability webhooks (account.updated)."}, {"id": "payment-hold-capture", "title": "Two-Phase Payment Authorization Hold & Capture Lifecycle", "note": "Implement the complete ride payment lifecycle starting with a pre-authorization hold via stripe.paymentIntents.create with capture_method='manual' upon trip request confirmation. Attach customer PaymentMethods stored securely in Stripe Vault and pass the calculated upfront fare amount with setup_future_usage options for streamlined one-click rebooking. When the trip status transitions to COMPLETED, compute the final fare including actual mileage, wait-time fees, route tolls, and driver tips, then execute stripe.paymentIntents.capture with amount_to_capture. If the trip is cancelled before pickup within the grace period, call stripe.paymentIntents.cancel to release the held funds immediately and notify the rider. For non-grace cancellations, execute a partial capture corresponding to the standard platform cancellation fee."}, {"id": "webhook-handler-idempotency", "title": "Idempotent Stripe Webhook Ingestion & Financial Ledger Logging", "note": "Build the dedicated webhook listener endpoint POST /api/v1/payments/webhook configured with raw-body parsing to verify stripe-signature headers using stripe.Webhook.constructEvent. Handle critical asynchronous events including 'payment_intent.succeeded', 'payment_intent.payment_failed', 'charge.refunded', 'account.updated', and 'transfer.created'. Implement an idempotency guard using an 'idempotency_keys' database table with unique constraints on Stripe Event IDs to reject duplicate webhook deliveries gracefully with HTTP 200. On successful capture, write corresponding credit and debit entries to the immutable 'ledger_entries' table for rider charge, platform commission revenue, and driver payout liability. Implement retry mechanisms with dead-letter queue routing for downstream business logic failures during webhook handling."}]}, {"id": "phase-5-realtime-launch", "title": "Phase 5: Real-Time Telemetry, Push Notifications & Production Launch", "description": "Scale WebSocket telemetry for live map tracking, configure high-priority FCM push notifications for critical ride events, and execute the production readiness checklist.", "tip": "Throttling and batching driver telemetry updates at 1-2 Hz intervals prevents saturating client rendering threads and backend WebSocket servers while maintaining smooth vehicle animation on maps. Implement exponential reconnection backoffs with heartbeat pings on mobile WebSocket connections to gracefully recover from cellular handoffs between Wi-Fi and 5G towers. Conduct end-to-end chaos engineering tests against simulated database failovers, Redis network partitions, and third-party payment gateway latency prior to launch.", "tasks": [{"id": "websocket-location-streaming", "title": "WebSocket Telemetry & Live Map Route Interpolation", "note": "Deploy high-throughput WebSocket gateway endpoints at /ws/v1/tracking authenticated via handshake query token validation. Connect WebSocket worker nodes to Redis Pub/Sub channels keyed by trip ID ('trips:tracking:<trip_id>') to broadcast driver location updates to connected rider apps with sub-100ms latency. Throttle location transmissions from driver devices to 1 Hz, embedding GPS coordinates, compass bearing, vehicle speed, and accuracy radius within the payload. Implement client-side linear interpolation (lerp) and bezier spline smoothing on Mapbox/Google Maps SDKs to render smooth vehicle movement between GPS update intervals. Handle abrupt socket disconnects, automatic session resumption via message sequence IDs, and channel cleanup upon trip completion."}, {"id": "fcm-push-notifications", "title": "Firebase Cloud Messaging (FCM) & Apple APNs Push Dispatcher", "note": "Integrate the Firebase Admin SDK to deliver low-latency, high-priority push notifications and Apple Push Notification service (APNs) VoIP/Live Activity pings. Create the background notification worker listening to trip state transitions to dispatch alerts for DRIVER_ASSIGNED, DRIVER_ARRIVED, TRIP_STARTED, and RECEIPT_READY. Manage multi-device user device tokens in a 'device_tokens' table with automated invalidation when FCM returns 'messaging/registration-token-not-registered'. Configure notification channels on Android 8.0+ and APNs alert payloads with custom sound files, action buttons (e.g., 'Call Driver', 'Cancel Ride'), and high-priority flags for urgent dispatch alerts. Handle offline delivery fallback, localized notification templates in multiple languages, and badge count synchronizations across devices."}, {"id": "production-deployment-checklist", "title": "Production Hardening, Load Testing & Launch Readiness", "note": "Execute the comprehensive production readiness checklist across cloud infrastructure, security, monitoring, and compliance. Deploy containerized microservices to Kubernetes (EKS/GKE) or AWS ECS with auto-scaling policies based on CPU utilization and active WebSocket connection counts. Conduct stress and load testing with k6 or Locust simulating 10,000 concurrent riders and 2,500 active drivers generating spatial queries and booking requests. Implement distributed tracing with OpenTelemetry, structured JSON logging with Datadog/ELK, and Prometheus/Grafana dashboards for real-time tracking of matching latency, payment failures, and API 5xx errors. Finalize security audits covering OWASP Top 10 vulnerabilities, PCI-DSS compliance verification for Stripe tokenization, automated database point-in-time backups, and a multi-region disaster recovery runbook."}]}]};

    const SAMPLE = {
      project: { name: 'VizCraft Progress', description: 'Sample Tracking Data', theme: 'dark_neon' },
      phases: [
        {
          id: 'p1', title: 'Phase 1: Foundation', description: 'Setup infrastructure and core utilities',
          tip: 'Ensure all base dependencies are pinned to avoid drift.',
          tasks: [
            { id: 't1', title: 'Initialize repository', note: 'Run `git init`, create **README**, setup .gitignore for Python.', done: true, priority: 'high', owner: 'Sam' },
            { id: 't2', title: 'Setup virtual environment', note: 'Create venv using Python 3.11 and install base requirements.' },
            { id: 't3', title: 'Configure logger', note: 'Setup standard logging module:\n- console handler\n- file handler' }
          ]
        },
        {
          id: 'p2', title: 'Phase 2: Core Engine', description: 'Build the primary execution loop',
          tip: 'Keep the main loop non-blocking to allow for future UI integrations.',
          tasks: [
            { id: 't4', title: 'Implement brain.py', note: 'Create the LLM router and context manager.', priority: 'medium' },
            { id: 't5', title: 'Add tool dispatcher', note: 'Map function names to actual python callables in tools.py.', due: 'Fri' }
          ]
        }
      ]
    };

    const vizData = INJECTED || SAMPLE;
    const SVG_CHECK = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>';
    const PRIORITY = {
      p0: ['high', 'P0'], high: ['high', 'High'], critical: ['high', 'Critical'],
      p1: ['med', 'P1'], medium: ['med', 'Medium'], med: ['med', 'Medium'],
      p2: ['low', 'P2'], low: ['low', 'Low']
    };
    const $ = id => document.getElementById(id);

    /* Normalise the input: guarantee ids, arrays and strings. */
    const phases = (vizData.phases || []).map((p, pi) => {
      const pid = String(p.id != null ? p.id : 'phase-' + pi);
      return {
        id: pid, title: String(p.title || 'Phase ' + (pi + 1)), description: p.description || '', tip: p.tip || '',
        tasks: (p.tasks || []).map((t, ti) => ({
          id: String(t.id != null ? t.id : pid + '-t' + ti),
          title: String(t.title || 'Task ' + (ti + 1)), note: t.note || '', done: !!t.done,
          priority: t.priority ? String(t.priority).toLowerCase() : '', owner: t.owner || '', due: t.due || '',
          tags: Array.isArray(t.tags) ? t.tags : []
        }))
      };
    });
    const allTasks = [];
    phases.forEach(p => p.tasks.forEach(t => allTasks.push({ phase: p, task: t })));

    let currentZoom = 1;
    let state = { tasks: {} };

    function getStorageKey() {
      const name = (vizData.project && vizData.project.name) || 'default';
      return 'vizcraft_progress_' + name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
    }
    function loadState() { try { const saved = localStorage.getItem(getStorageKey()); if (saved) state = JSON.parse(saved); } catch (e) { /* ignore */ } if (!state.tasks) state.tasks = {}; }
    function saveState() { try { localStorage.setItem(getStorageKey(), JSON.stringify(state)); } catch (e) { /* ignore */ } }

    /* A saved tick wins; otherwise the task's own `done` flag seeds the state. */
    const isDone = t => (t.id in state.tasks) ? !!state.tasks[t.id] : t.done;

    function metaChips(t) {
      const chips = [];
      const pr = PRIORITY[t.priority];
      if (pr) chips.push('<span class="chip pri-' + pr[0] + '">' + pr[1] + '</span>');
      else if (t.priority) chips.push('<span class="chip">' + escapeHtml(t.priority) + '</span>');
      if (t.owner) chips.push('<span class="chip">@' + escapeHtml(t.owner) + '</span>');
      if (t.due) chips.push('<span class="chip">due ' + escapeHtml(t.due) + '</span>');
      t.tags.forEach(tag => chips.push('<span class="chip">#' + escapeHtml(tag) + '</span>'));
      return chips.join('');
    }

    /* Tiny, safe markdown subset for notes: **bold**, *italic*, `code`, "- " bullets. */
    function renderNote(text) {
      const inline = s => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
      let html = '', inList = false;
      escapeHtml(text).split('\n').forEach(line => {
        const m = line.match(/^\s*[-*]\s+(.*)$/);
        if (m) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(m[1]) + '</li>'; return; }
        if (inList) { html += '</ul>'; inList = false; }
        html += line.trim() === '' ? '<div class="gap"></div>' : '<p>' + inline(line) + '</p>';
      });
      return html + (inList ? '</ul>' : '');
    }

    function init() {
      const project = vizData.project || {};
      const theme = resolveTheme(project.theme);
      document.body.setAttribute('data-theme', theme);
      populateThemeSelect($('theme-select'), theme);

      const nameEl = document.querySelector('.project-name');
      if (nameEl.textContent === 'Stripe-Managed SaaS Uber — MVP Build') {
        nameEl.textContent = project.name || 'Progress Tracker';
        document.querySelector('.project-desc').textContent = project.description || 'Track your project phases and tasks';
      }

      loadState();
      renderPhases();
      renderSidebarTasks();
      bindEvents();
      updateProgress();
      $('main-container').classList.add('sidebar-open');

      const cards = Array.from(document.querySelectorAll('.phase-card'));
      if (REDUCED_MOTION) return;
      cards.forEach(c => c.classList.add('pre'));
      gsap.to(cards, {
        y: 0, opacity: 1, duration: 0.8, stagger: 0.1, ease: 'power3.out', delay: 0.2,
        onComplete: () => cards.forEach(c => { c.classList.remove('pre'); c.style.transform = ''; c.style.opacity = ''; })
      });
      // Safety net: never leave cards hidden if the tween is interrupted
      setTimeout(() => cards.forEach(c => { c.classList.remove('pre'); c.style.transform = ''; c.style.opacity = ''; }), 2600);
    }

    function bindEvents() {
      // One delegated listener handles every checkbox / label, in the grid and the sidebar.
      document.addEventListener('click', ev => {
        const box = ev.target.closest('.custom-checkbox');
        if (box) { toggleTask(box.closest('[data-task-id]').dataset.taskId); return; }
        const label = ev.target.closest('.task-label');
        if (label) { const item = label.closest('[data-task-id]'); showNote(item.dataset.phaseId, item.dataset.taskId); return; }
        const head = ev.target.closest('.sidebar-phase-header');
        if (head) head.parentElement.classList.toggle('expanded');
      });

      const sidebar = $('sidebar');
      $('sidebar-toggle').addEventListener('click', () => {
        sidebar.classList.toggle('open');
        $('main-container').classList.toggle('sidebar-open', sidebar.classList.contains('open'));
      });
      document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
      $('theme-select').addEventListener('change', ev => document.body.setAttribute('data-theme', ev.target.value));
      $('hide-done').addEventListener('change', ev => document.body.classList.toggle('hide-done', ev.target.checked));
      $('reset-progress').addEventListener('click', () => {
        if (!window.confirm('Reset all progress for this tracker?')) return;
        state = { tasks: {} };
        allTasks.forEach(({ task }) => { state.tasks[task.id] = false; });
        saveState();
        document.querySelectorAll('[data-task-id]').forEach(el => el.classList.remove('checked'));
        updateProgress();
      });
      $('next-up').addEventListener('click', () => { const n = nextTask(); if (n) showNote(n.phase.id, n.task.id); });
      $('zoom-in').addEventListener('click', () => zoom(0.2));
      $('zoom-out').addEventListener('click', () => zoom(-0.2));
      $('zoom-reset').addEventListener('click', resetZoom);
    }

    function nextTask() { return allTasks.find(({ task }) => !isDone(task)) || null; }

    function toggleTask(taskId) {
      const found = allTasks.find(x => x.task.id === taskId);
      if (!found) return;
      const nowDone = !isDone(found.task);
      state.tasks[taskId] = nowDone;
      saveState();
      document.querySelectorAll('[data-task-id]').forEach(el => {
        if (el.dataset.taskId !== taskId) return;
        el.classList.toggle('checked', nowDone);
        const cb = el.querySelector('.custom-checkbox');
        if (nowDone && cb) gsap.fromTo(cb, { scale: 0.8, rotation: -15 }, { scale: 1, rotation: 0, duration: 0.5, ease: 'back.out(2)' });
      });
      updateProgress();
    }

    function updateProgress() {
      let total = 0, completed = 0;
      phases.forEach(p => {
        const done = p.tasks.filter(isDone).length;
        total += p.tasks.length; completed += done;
        const fill = $('phase-fill-' + p.id), frac = $('sidebar-fraction-' + p.id), card = $('phase-card-' + p.id);
        if (fill) fill.style.width = p.tasks.length ? (done / p.tasks.length * 100) + '%' : '100%';
        if (frac) frac.textContent = done + '/' + p.tasks.length;
        if (!card) return;
        const complete = p.tasks.length > 0 && done === p.tasks.length;
        const was = card.classList.contains('completed');
        card.classList.toggle('completed', complete);
        if (complete && !was) {
          const badge = card.querySelector('.complete-badge');
          gsap.fromTo(badge, { scale: 0.5, opacity: 0, y: 10 }, { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: 'back.out(1.5)' });
        }
      });
      $('overall-progress-fill').style.width = total ? (completed / total * 100) + '%' : '100%';
      $('overall-progress-label').textContent = completed + ' / ' + total + ' tasks';
      const n = nextTask();
      $('next-up').style.display = n ? 'block' : 'none';
      if (n) $('next-up-title').textContent = n.task.title;
    }

    function showNote(phaseId, taskId) {
      const found = allTasks.find(x => x.phase.id === phaseId && x.task.id === taskId);
      if (!found) return;
      const { phase, task } = found;
      $('notes-empty').style.display = 'none';
      $('notes-container').style.display = 'block';
      $('notes-task-title').textContent = task.title;
      $('notes-meta').innerHTML = metaChips(task) || '<span class="chip">' + escapeHtml(phase.title) + '</span>';
      $('notes-content-text').innerHTML = renderNote(task.note || 'No details provided.');
      const tip = $('notes-phase-tip');
      tip.style.display = phase.tip ? 'block' : 'none';
      tip.querySelector('span').textContent = phase.tip;
      switchTab('notes');
      $('sidebar').classList.add('open');
      $('main-container').classList.add('sidebar-open');
    }

    function taskHtml(p, t, color, compact) {
      const checked = isDone(t) ? ' checked' : '';
      const meta = compact ? '' : (metaChips(t) ? '<div class="task-meta">' + metaChips(t) + '</div>' : '');
      const size = compact ? ' style="color:' + color + ';width:14px;height:14px;margin-top:1px"' : ' style="color:' + color + '"';
      return '<' + (compact ? 'div class="sidebar-task-item task-item' : 'li class="task-item') + checked + '" data-task-id="' + escapeHtml(t.id) + '" data-phase-id="' + escapeHtml(p.id) + '">' +
        '<div class="custom-checkbox"' + size + '>' + SVG_CHECK + '</div>' +
        '<div class="task-body"><div class="task-label">' + escapeHtml(t.title) + '</div>' + meta + '</div>' +
        '</' + (compact ? 'div' : 'li') + '>';
    }

    function renderPhases() {
      const grid = $('phases-grid');
      grid.innerHTML = '';
      phases.forEach((p, index) => {
        const color = 'var(--phase-' + (index % 6 + 1) + ')';
        const card = document.createElement('div');
        card.className = 'phase-card';
        card.id = 'phase-card-' + p.id;
        card.style.setProperty('--phase-color', color);
        card.innerHTML =
          '<div class="complete-badge">PHASE COMPLETE</div>' +
          '<div class="phase-num">Phase ' + String(index + 1).padStart(2, '0') + '</div>' +
          '<div class="phase-title">' + escapeHtml(p.title) + '</div>' +
          '<div class="phase-desc">' + escapeHtml(p.description) + '</div>' +
          '<div class="mini-progress-bg"><div class="mini-progress-fill" id="phase-fill-' + escapeHtml(p.id) + '" style="background-color:' + color + '"></div></div>' +
          '<ul class="task-list">' + p.tasks.map(t => taskHtml(p, t, color, false)).join('') + '</ul>';
        grid.appendChild(card);
      });
    }

    function renderSidebarTasks() {
      const container = $('tab-tasks');
      container.innerHTML = '';
      phases.forEach((p, index) => {
        const color = 'var(--phase-' + (index % 6 + 1) + ')';
        const div = document.createElement('div');
        div.className = 'sidebar-phase expanded';
        div.innerHTML =
          '<div class="sidebar-phase-header">' +
            '<div class="sidebar-phase-dot" style="background:' + color + ';color:' + color + '"></div>' +
            '<div class="sidebar-phase-title">' + escapeHtml(p.title) + '</div>' +
            '<div class="sidebar-phase-fraction" id="sidebar-fraction-' + escapeHtml(p.id) + '">0/0</div>' +
          '</div>' +
          '<div class="sidebar-tasks">' + p.tasks.map(t => taskHtml(p, t, color, true)).join('') + '</div>';
        container.appendChild(div);
      });
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      $('tab-' + tabId).classList.add('active');
    }

    function zoom(delta) {
      currentZoom = Math.max(0.4, Math.min(currentZoom + delta, 2));
      $('phases-viewport').style.transform = 'scale(' + currentZoom + ')';
    }
    function resetZoom() { currentZoom = 1; $('phases-viewport').style.transform = 'scale(1)'; }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
